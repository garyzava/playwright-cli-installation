<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
      padding: 2.5rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #333;
    }

    label .optional {
      font-weight: 400;
      color: #999;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1.5px solid #d0d5dd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    input.invalid, select.invalid, textarea.invalid {
      border-color: #dc2626;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .char-counter {
      text-align: right;
      font-size: 0.75rem;
      color: #999;
      margin-top: 0.25rem;
    }

    .char-counter.warn { color: #f59e0b; }
    .char-counter.limit { color: #dc2626; }

    .error-msg {
      color: #dc2626;
      font-size: 0.8rem;
      margin-top: 0.3rem;
      display: none;
    }

    .error-msg.visible { display: block; }

    .checkbox-field {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .checkbox-field input[type="checkbox"] {
      margin-top: 0.2rem;
      width: 16px;
      height: 16px;
      accent-color: #4f46e5;
    }

    .checkbox-field label {
      font-weight: 400;
      font-size: 0.9rem;
      margin-bottom: 0;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover:not(:disabled) { background: #4338ca; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    .success {
      display: none;
      text-align: center;
      padding: 2rem 0;
    }

    .success.visible { display: block; }

    .success-icon {
      width: 64px;
      height: 64px;
      background: #dcfce7;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .success-icon svg { width: 32px; height: 32px; color: #16a34a; }

    .success h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: #16a34a;
    }

    .success p {
      color: #666;
      margin-bottom: 1.5rem;
    }

    .success a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .success a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div data-testid="form-section" id="form-section">
    <h1>Contact Us</h1>
    <p class="subtitle">We'd love to hear from you. Fill out the form below.</p>

    <form id="contact-form" data-testid="form" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" data-testid="input-name" placeholder="Jane Smith">
        <div class="error-msg" data-testid="error-name" id="error-name"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" data-testid="input-email" placeholder="jane@example.com">
        <div class="error-msg" data-testid="error-email" id="error-email"></div>
      </div>

      <div class="field">
        <label for="phone">Phone <span class="optional">(optional)</span></label>
        <input type="tel" id="phone" name="phone" data-testid="input-phone" placeholder="555-123-4567">
        <div class="error-msg" data-testid="error-phone" id="error-phone"></div>
      </div>

      <div class="field">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" data-testid="input-subject">
          <option value="">-- Select --</option>
          <option value="general">General Inquiry</option>
          <option value="support">Support</option>
          <option value="feedback">Feedback</option>
          <option value="other">Other</option>
        </select>
        <div class="error-msg" data-testid="error-subject" id="error-subject"></div>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" data-testid="input-message" maxlength="500" placeholder="Tell us what's on your mind..."></textarea>
        <div class="char-counter" data-testid="char-counter" id="char-counter">0 / 500</div>
        <div class="error-msg" data-testid="error-message" id="error-message"></div>
      </div>

      <div class="checkbox-field">
        <input type="checkbox" id="subscribe" name="subscribe" data-testid="input-subscribe">
        <label for="subscribe">Subscribe to our newsletter</label>
      </div>

      <div class="checkbox-field">
        <input type="checkbox" id="terms" name="terms" data-testid="input-terms">
        <label for="terms">I agree to the Terms and Conditions</label>
      </div>
      <div class="error-msg" data-testid="error-terms" id="error-terms" style="margin-top:-0.5rem;margin-bottom:0.75rem;"></div>

      <button type="submit" id="submit-btn" data-testid="submit-btn" disabled>Submit</button>
    </form>
  </div>

  <div class="success" data-testid="success-message" id="success-section">
    <div class="success-icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h2>Message Sent!</h2>
    <p data-testid="success-text" id="success-text"></p>
    <a data-testid="send-another" id="send-another">Send another message</a>
  </div>
</div>

<script>
  const form = document.getElementById('contact-form');
  const formSection = document.getElementById('form-section');
  const successSection = document.getElementById('success-section');
  const successText = document.getElementById('success-text');
  const sendAnother = document.getElementById('send-another');
  const submitBtn = document.getElementById('submit-btn');
  const termsCheckbox = document.getElementById('terms');
  const messageField = document.getElementById('message');
  const charCounter = document.getElementById('char-counter');

  // Toggle submit button based on terms checkbox
  termsCheckbox.addEventListener('change', () => {
    submitBtn.disabled = !termsCheckbox.checked;
  });

  // Live character counter
  messageField.addEventListener('input', () => {
    const len = messageField.value.length;
    charCounter.textContent = `${len} / 500`;
    charCounter.classList.remove('warn', 'limit');
    if (len >= 500) charCounter.classList.add('limit');
    else if (len >= 450) charCounter.classList.add('warn');
  });

  function showError(id, msg) {
    const el = document.getElementById(`error-${id}`);
    el.textContent = msg;
    el.classList.add('visible');
    const input = document.getElementById(id);
    if (input) input.classList.add('invalid');
  }

  function clearErrors() {
    document.querySelectorAll('.error-msg').forEach(el => {
      el.textContent = '';
      el.classList.remove('visible');
    });
    document.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
  }

  function validate() {
    clearErrors();
    let valid = true;

    const name = document.getElementById('name').value.trim();
    if (!name) { showError('name', 'Full name is required.'); valid = false; }
    else if (name.length < 2) { showError('name', 'Name must be at least 2 characters.'); valid = false; }

    const email = document.getElementById('email').value.trim();
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email) { showError('email', 'Email is required.'); valid = false; }
    else if (!emailPattern.test(email)) { showError('email', 'Please enter a valid email address.'); valid = false; }

    const phone = document.getElementById('phone').value.trim();
    if (phone && !/^[\d\s\-().+]+$/.test(phone)) {
      showError('phone', 'Phone may only contain digits, dashes, parentheses, and spaces.');
      valid = false;
    }

    const subject = document.getElementById('subject').value;
    if (!subject) { showError('subject', 'Please select a subject.'); valid = false; }

    const message = messageField.value.trim();
    if (!message) { showError('message', 'Message is required.'); valid = false; }
    else if (message.length < 10) { showError('message', 'Message must be at least 10 characters.'); valid = false; }

    if (!termsCheckbox.checked) { showError('terms', 'You must agree to the Terms and Conditions.'); valid = false; }

    return valid;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!validate()) {
      submitBtn.classList.add('shake');
      setTimeout(() => submitBtn.classList.remove('shake'), 400);
      return;
    }

    const name = document.getElementById('name').value.trim();
    successText.textContent = `Thank you, ${name}! Your message has been sent.`;
    formSection.style.display = 'none';
    successSection.classList.add('visible');
  });

  sendAnother.addEventListener('click', (e) => {
    e.preventDefault();
    form.reset();
    clearErrors();
    charCounter.textContent = '0 / 500';
    charCounter.classList.remove('warn', 'limit');
    submitBtn.disabled = true;
    successSection.classList.remove('visible');
    formSection.style.display = '';
  });
</script>

</body>
</html>
